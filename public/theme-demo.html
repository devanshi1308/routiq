<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Routiq theme demo</title>
<link rel="stylesheet" href="/theme.css">
<style>
  /* the page itself uses only semantic tokens */
  main{max-width:560px;margin:0 auto;padding:24px}
  .card{background:var(--color-surface);border-radius:var(--radius-md);padding:16px;margin-top:14px}
  .raised{background:var(--color-surface-raised);box-shadow:var(--shadow-raised)}
  .muted{color:var(--color-text-muted)}
  .btn{display:inline-block;background:var(--color-accent);color:var(--color-on-accent);border:0;border-radius:var(--radius-sm);padding:12px 18px;font:700 16px var(--font-sans)}
  .btn.alt{background:transparent;color:var(--color-text);border:2px solid var(--color-border-strong)}
  input{width:100%;box-sizing:border-box;padding:12px;border-radius:var(--radius-sm);border:2px solid var(--color-border-strong);background:var(--color-bg);color:var(--color-text);font:16px var(--font-sans)}
  .ok{color:var(--color-success-text)}.bad{color:var(--color-danger-text)}.warn{color:var(--color-warning-text)}
  .bar{height:8px;border-radius:4px;background:var(--color-border);overflow:hidden}.bar i{display:block;width:60%;height:100%;background:var(--color-success)}
  .logo{width:36px;height:36px;background:var(--logo-mark) center/contain no-repeat}
  nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  nav button{border:2px solid var(--color-border-strong);background:var(--color-bg);color:var(--color-text);border-radius:999px;padding:8px 14px;font:600 14px var(--font-sans);cursor:pointer}
</style>
</head>
<body>
<main>
  <div class="logo" role="img" aria-label="Routiq"></div>
  <h1>Theme demo</h1>
  <p class="muted">Works with no JavaScript: it follows your system. The buttons below are an optional extra that set a class on the page.</p>
  <nav aria-label="Theme"><button data-t="">System</button><button data-t="light">Light</button><button data-t="dark">Dark</button><button data-t="sepia">Sepia</button></nav>
  <div class="card"><strong>Card</strong><p class="muted">Secondary text on a card. <a href="#">A link</a></p><div class="bar"><i></i></div></div>
  <div class="card raised"><strong>Raised sheet</strong><p class="muted">Floating surface with a shadow.</p></div>
  <div class="card"><label for="n"><strong>Phone number</strong></label><br><input id="n" placeholder="98765 43210"><p><button class="btn">Continue</button> <button class="btn alt">Cancel</button></p>
    <p><span class="ok">Saved.</span> <span class="bad">Invalid code.</span> <span class="warn">Low balance.</span></p></div>
</main>
<script>
/* optional: remember a chosen theme. Without this script the page still themes itself from the system setting. */
(function(){var r=document.documentElement,k="routiq:theme-class";
function set(t){r.className=r.className.replace(/\btheme-\S+/g,"").trim();if(t)r.classList.add("theme-"+t);try{t?localStorage.setItem(k,t):localStorage.removeItem(k)}catch(e){}}
try{var s=localStorage.getItem(k);if(s)set(s)}catch(e){}
document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){set(b.dataset.t)}});})();
</script>
</body></html>
